name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_DEMO: "1"   # APK de demostración: funciona sin servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compilar APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: planta-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
